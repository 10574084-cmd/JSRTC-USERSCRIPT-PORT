name: Validate userscripts

on:
  push:
    branches: [main]
    paths:
      - "jsRTC.user.js"
      - "jsRTC-JS-LAB.user.js"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "jsRTC.user.js"
      - "jsRTC-JS-LAB.user.js"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate main userscript syntax
        run: node --check jsRTC.user.js
      - name: Validate JavaScript Lab syntax
        run: node --check jsRTC-JS-LAB.user.js
